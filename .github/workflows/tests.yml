name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["strategies-db.json", "games-db.json", "docs/**", "*.md"]
  pull_request:

# Проверкам нужен только код: ни записи в репозиторий, ни токена в git-конфиге.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps (runtime, по хэшам из lock, инструменты, из dev)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --require-hashes -r requirements.lock
          python -m pip install -q -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check main.py app scripts tools tests
      - name: Licenses (файлы на месте)
        shell: pwsh
        run: |
          $need = 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'LICENSES\LGPL-3.0.txt', 'LICENSES\GPL-3.0.txt',
                  'LICENSES\GPL-2.0.txt', 'LICENSES\MIT-zapret.txt', 'LICENSES\MIT-flowseal.txt',
                  'LICENSES\WinDivert-LICENSE.txt', 'LICENSES\PSF-2.0.txt', 'LICENSES\INSTALLER-NOTICE.txt'
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "нет файлов лицензий: $($missing -join ', ')" }
      - name: "Types (pyright, блокирует: app, main.py, tools, scripts)"
        run: python -m pyright
      - name: Tests (with coverage floor)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null  # база для --basetemp в чистом клоне
          python -m pytest -q tests --basetemp build/pytest --cov=app --cov-report=term --cov-fail-under=70

  audit:
    # Уязвимости в зависимостях и SBOM: pip-audit падает на найденной CVE, поэтому сборка не пройдёт.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: python -m pip install -q --upgrade pip pip-audit cyclonedx-bom
      - name: Dependencies with known vulnerabilities
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.txt -o bom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          if-no-files-found: error
          path: bom.json

name: games-db

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: games-db
  cancel-in-progress: false

jobs:
  merge:
    if: startsWith(github.event.issue.title, '[games]')
    runs-on: ubuntu-latest
    steps:
      # Токен в git-конфиге нужен: шаг Commit сам делает git push (здесь же и права на запись).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Merge report
        id: merge
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPORTER: ${{ github.event.issue.user.login }}
        run: |
          if python scripts/merge_games.py; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      - name: Commit
        if: steps.merge.outputs.ok == '1'
        run: |
          git config user.name "games-db bot"
          git config user.email "actions@users.noreply.github.com"
          git add games-db.json
          changed=$(git diff --cached --name-only | tr '\n' ' ')
          # в коммит должен попасть ровно один файл: скрипт слияния не повод коммитить что-то ещё
          # пустой diff, такой отчёт уже был: это не ошибка и не повод не закрывать issue
          if [ -n "$changed" ] && [ "$changed" != "games-db.json " ]; then echo "unexpected staged files: $changed"; exit 1; fi
          git diff --cached --quiet || (git commit -m "games-db: report #${{ github.event.issue.number }}" && git pull --rebase && git push)
      - name: Close issue
        if: always()  # даже если слияние упало, issue надо закрыть с объяснением
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.merge.outputs.ok }}
        run: |
          if [ "$OK" = "1" ]; then msg="Спасибо! Адреса добавлены. В общую базу попадают адреса, которые прислали хотя бы двое."; else msg="Отчёт не прошёл проверку и не добавлен."; fi
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "$msg"

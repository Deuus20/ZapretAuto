name: strategy-db

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: strategy-db
  cancel-in-progress: false

jobs:
  merge:
    if: startsWith(github.event.issue.title, '[report]')
    runs-on: ubuntu-latest
    steps:
      # Токен в git-конфиге нужен: шаг Commit сам делает git push (здесь же и права на запись).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Merge report
        id: merge
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPORTER: ${{ github.event.issue.user.login }}  # голоса считаются по авторам, а не по issue
        run: |
          if python scripts/merge_report.py; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      - name: Commit
        if: steps.merge.outputs.ok == '1'
        run: |
          git config user.name "strategy-db bot"
          git config user.email "actions@users.noreply.github.com"
          git add strategies-db.json
          changed=$(git diff --cached --name-only | tr '\n' ' ')
          # в коммит должен попасть ровно один файл: скрипт слияния не повод коммитить что-то ещё
          # пустой diff — такой отчёт уже был: это не ошибка и не повод не закрывать issue
          if [ -n "$changed" ] && [ "$changed" != "strategies-db.json " ]; then echo "unexpected staged files: $changed"; exit 1; fi
          git diff --cached --quiet || (git commit -m "strategy-db: report #${{ github.event.issue.number }}" && git pull --rebase && git push)
      - name: Close issue
        if: always()  # даже если слияние упало, issue надо закрыть с объяснением
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.merge.outputs.ok }}
        run: |
          if [ "$OK" = "1" ]; then msg="Спасибо! Результат добавлен в общую базу."; else msg="Отчёт не прошёл проверку и не добавлен."; fi
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "$msg"

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.1.0"
        required: true
      publish:
        description: "Publish to the release (false = only upload a build artifact)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches app version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}".TrimStart('v')
          $ver = (Select-String -Path app\__init__.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "tag $tag != app version $ver" }
      - name: Install build tools
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -q -r requirements.txt
          choco install innosetup -y --no-progress
      - name: Build (tests + exe + installer)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
      - name: Self-test the frozen exe
        shell: pwsh
        run: |
          $p = Start-Process dist\ZapretAuto\ZapretAuto.exe -ArgumentList '--selftest' -PassThru -Wait
          Get-Content dist\ZapretAuto\selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: ZapretAuto-Setup
          path: |
            dist/ZapretAuto-Setup.exe*
            dist/ZapretAuto-portable.zip*
      - name: Publish release
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $notes = "**Как установить:** скачайте ZapretAuto-Setup.exe ниже и запустите. Если программа уже стоит, она обновится сама. Без установки: ZapretAuto-portable.zip — распакуйте и запустите ZapretAuto.exe. Подробнее — в [инструкции](https://github.com/${{ github.repository }}/blob/main/docs/install.md)."
          # what changed: this version's section of CHANGELOG.md goes on top of the release page
          $md = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $v = [regex]::Escape($tag.TrimStart('v'))
          if ($md -match "(?ms)^## $v\b[^\n]*\n(.*?)(?=^## |\z)") { $notes = $Matches[1].Trim() + "`n`n" + $notes }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\ZapretAuto-Setup.exe dist\ZapretAuto-Setup.exe.sha256 dist\ZapretAuto-portable.zip dist\ZapretAuto-portable.zip.sha256 --clobber
            gh release edit $tag --notes $notes
          } else {
            gh release create $tag dist\ZapretAuto-Setup.exe dist\ZapretAuto-Setup.exe.sha256 dist\ZapretAuto-portable.zip dist\ZapretAuto-portable.zip.sha256 --title "ZapretAuto $($tag.TrimStart('v'))" --notes $notes
          }

name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["strategies-db.json", "docs/**", "*.md"]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psutil requests curl_cffi pytest pyflakes
      - run: python -m pyflakes main.py app scripts tests tools
      - run: python -m pytest -q tests

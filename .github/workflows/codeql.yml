name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # раз в неделю: новые правила появляются и без изменений в коде

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # отчёт CodeQL уходит в Security tab
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          languages: python
          # Только безопасность. Пакет security-and-quality тянет стилевые правила (empty-except, cyclic-import,
          # unnecessary-lambda и т. п.): они дублируют ruff и pyright, а их срабатывания на намеренные приёмы
          # (ленивые импорты, best-effort очистка) только шумят в Security tab.
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
